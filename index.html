<html>
<script>

const gradeRules = [

{ grade:"A", min:373 },
{ grade:"A-", min:328 },
{ grade:"B+", min:309 },
{ grade:"B", min:287 },
{ grade:"B-", min:264 },
{ grade:"C+", min:250 },
{ grade:"C", min:233 },
{ grade:"C-", min:216 },
{ grade:"D+", min:184 },
{ grade:"D", min:167 }

];

function oralStatus(part1, part2){

    if(
        part1==="Satisfactory" &&
        part2==="Satisfactory"
    ){
        return "bothS";
    }

    if(
        part1==="Satisfactory" ||
        part2==="Satisfactory"
    ){
        return "oneS";
    }

    return "bothU";
}

function update(){

const currentPoints =
Number(document.getElementById("points").value);

const quizzesGraded =
Number(document.getElementById("quizzes").value);

const reflectionsGraded =
Number(document.getElementById("reflections").value);

const exitTicketsGraded =
Number(document.getElementById("exitTickets").value);

const part1 =
document.getElementById("part1").value;

const part2 =
document.getElementById("part2").value;

const finalPaper =
document.getElementById("finalPaper").value;

const remainingQuizPoints =
(10-quizzesGraded)*10;

const remainingReflectionPoints =
(4-reflectionsGraded)*25;

const remainingExitTicketPoints =
(26-exitTicketsGraded)*10;

const remainingPoints =
remainingQuizPoints +
remainingReflectionPoints +
remainingExitTicketPoints;

const maximumPossiblePoints =
currentPoints +
remainingPoints;

const futurePart1 =
part1==="Not Graded Yet"
? "Satisfactory"
: part1;

const futurePart2 =
part2==="Not Graded Yet"
? "Satisfactory"
: part2;

const futurePaper =
finalPaper==="Not Graded Yet"
? "Excellent"
: finalPaper;

const futureOral =
oralStatus(
futurePart1,
futurePart2
);

let highestGrade = "F";

if(
maximumPossiblePoints >= 373 &&
futureOral==="bothS" &&
futurePaper==="Excellent"
){
highestGrade="A";
}

else if(
maximumPossiblePoints >= 328 &&
futureOral==="bothS" &&
futurePaper==="Excellent"
){
highestGrade="A-";
}

else if(
maximumPossiblePoints >= 309 &&
(futureOral==="oneS" || futureOral==="bothS") &&
(
futurePaper==="Excellent" ||
futurePaper==="Proficient"
)
){
highestGrade="B+";
}

else if(
maximumPossiblePoints >= 287 &&
(futureOral==="oneS" || futureOral==="bothS") &&
futurePaper==="Proficient"
){
highestGrade="B";
}

else if(
maximumPossiblePoints >= 264 &&
(futureOral==="oneS" || futureOral==="bothS") &&
futurePaper==="Proficient"
){
highestGrade="B-";
}

else if(
maximumPossiblePoints >= 250 &&
futureOral==="bothU"
){
highestGrade="C+";
}

else if(
maximumPossiblePoints >= 233 &&
futureOral==="bothU" &&
futurePaper==="Developing"
){
highestGrade="C";
}

else if(
maximumPossiblePoints >= 216 &&
futureOral==="bothU" &&
futurePaper==="Developing"
){
highestGrade="C-";
}

else if(
maximumPossiblePoints >= 184 &&
futureOral==="bothU"
){
highestGrade="D+";
}

else if(
maximumPossiblePoints >= 167 &&
futureOral==="bothU" &&
futurePaper==="Needs Improvement"
){
highestGrade="D";
}

let targetMin = 0;

gradeRules.forEach(rule=>{

if(rule.grade===highestGrade){
targetMin = rule.min;
}

});

const pointsNeeded =
Math.max(
0,
targetMin-currentPoints
);

let draftRequirement = "";
let paperRequirement = "";

switch(highestGrade){

case "A":
case "A-":

draftRequirement =
"Both Draft 1 and Draft 2 must be Satisfactory.";

paperRequirement =
"Excellent";

break;

case "B+":
case "B":
case "B-":

draftRequirement =
"At least one of Draft 1 or Draft 2 must be Satisfactory.";

paperRequirement =
highestGrade==="B+"
? "Proficient or Excellent"
: "Proficient";

break;

case "C+":

draftRequirement =
"Both Draft 1 and Draft 2 must be Unsatisfactory.";

paperRequirement =
"Developing, Proficient, or Excellent";

break;

case "C":
case "C-":

draftRequirement =
"Both Draft 1 and Draft 2 must be Unsatisfactory.";

paperRequirement =
"Developing";

break;

case "D+":

draftRequirement =
"Both Draft 1 and Draft 2 must be Unsatisfactory.";

paperRequirement =
"Developing, Proficient, or Excellent";

break;

case "D":

draftRequirement =
"Both Draft 1 and Draft 2 must be Unsatisfactory.";

paperRequirement =
"Needs Improvement";

break;

}

document.getElementById(
"highestPossible"
).innerHTML = `

<h3>Highest Grade Still Possible: ${highestGrade}</h3>

<p>
Current Course Engagement Points:
<b>${currentPoints}</b>
</p>

<p>
Highest Possible Final Course Engagement Points:
<b>${maximumPossiblePoints}</b>
</p>

<hr>

<h3>
Minimum Needed For A ${highestGrade}
</h3>

<ul>

<li>
<b>Additional Points Needed:</b>
${pointsNeeded}
</li>

<li>
<b>Draft Requirement:</b>
${draftRequirement}
</li>

<li>
<b>Minimum Oral History Paper Grade:</b>
${paperRequirement}
</li>

</ul>

<hr>

<h3>Remaining Point Opportunities</h3>

<ul>

<li>
Quizzes Remaining:
<b>${10-quizzesGraded}</b>
(${remainingQuizPoints} possible points)
</li>

<li>
Reflections Remaining:
<b>${4-reflectionsGraded}</b>
(${remainingReflectionPoints} possible points)
</li>

<li>
Exit Tickets Remaining:
<b>${26-exitTicketsGraded}</b>
(${remainingExitTicketPoints} possible points)
</li>

</ul>

<p>
<b>
Total Remaining Available Points:
${remainingPoints}
</b>
</p>

<p>
<b>
To earn a ${highestGrade},
you need ${pointsNeeded}
of the remaining
${remainingPoints}
available points.
</b>
</p>

`;

const gradesInOrder = [
"A",
"A-",
"B+",
"B",
"B-",
"C+",
"C",
"C-",
"D+",
"D",
"F"
];

const highestIndex
</html>
